<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Photography &amp; Friends</title>
<meta name="apple-mobile-web-app-title" content="Photography &amp; Friends">
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #737373; --line: #ececec;
    --card: #ffffff; --accent: #ff3b5c; --chip: #f4f4f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --fg: #f5f5f5; --muted: #a3a3a3; --line: #262626; --card: #000; --chip: #1c1c1e; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.4; overscroll-behavior-y: contain;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo span { color: var(--accent); }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
  .icon-btn:active { background: var(--chip); }
  svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* Posts */
  .post { border-bottom: 1px solid var(--line); padding-bottom: 12px; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .post-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--chip); }
  .who { flex: 1; min-width: 0; }
  .who b { font-weight: 600; }
  .who small { display: block; color: var(--muted); font-size: 12px; }
  .media { position: relative; width: 100%; aspect-ratio: 4 / 5; max-height: 80vh; background: var(--chip); overflow: hidden; user-select: none; touch-action: manipulation; }
  .track { display: flex; width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; }
  .media img { width: 100%; height: 100%; object-fit: contain; display: block; opacity: 0; transition: opacity .4s; -webkit-user-drag: none; }
  .count { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; pointer-events: none; }
  .actions { position: relative; }
  .dots { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 4px; pointer-events: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background .2s, transform .2s; }
  .dots i.on { background: #0095f6; transform: scale(1.1); }
  .who small svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 2px; stroke-width: 2.2; }
  .cell { position: relative; }
  .multi { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; stroke: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .thumb { position: relative; flex: 0 0 auto; height: 180px; border-radius: 10px; overflow: hidden; background: var(--chip); }
  .thumb { transition: transform .15s, box-shadow .15s, opacity .15s; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .thumb img { height: 100%; width: auto; display: block; pointer-events: none; -webkit-user-drag: none; }
  .thumb.dragging { transition: none; z-index: 5; transform: scale(1.06); box-shadow: 0 10px 28px rgba(0,0,0,.35); opacity: .95; cursor: grabbing; }
  .strip.sorting .thumb:not(.dragging) { opacity: .75; }
  .thumb .mv { position: absolute; bottom: 6px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 17px; line-height: 27px; text-align: center; }
  .thumb .mv.l { right: 40px; } .thumb .mv.r { right: 6px; }
  .thumb .mv:disabled { opacity: .3; }
  .thumb .x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 26px; text-align: center; }
  .thumb .n { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; }
  .add-tile { flex: 0 0 120px; height: 180px; border-radius: 10px; border: 2px dashed var(--line); color: var(--muted); display: grid; place-items: center; text-align: center; font-size: 13px; }
  .add-tile b { display: block; font-size: 28px; font-weight: 300; color: var(--fg); }
  .preview.pick-box { aspect-ratio: 4 / 3; border: 2px dashed var(--line); }
  .pick-box span { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; }
  .pick-box svg { width: 40px; height: 40px; stroke: var(--fg); stroke-width: 1.5; margin-bottom: 4px; }
  .pick-box b { color: var(--fg); font-size: 16px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .fallback-photos img { width: 100%; border-radius: 10px; display: block; margin-bottom: 8px; -webkit-touch-callout: default; }
  .media img.loaded, body.viewer .media img { opacity: 1; }
  .burst { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; opacity: 0; transform: scale(.4); }
  .burst svg { width: 96px; height: 96px; fill: #fff; stroke: none; filter: drop-shadow(0 4px 18px rgba(0,0,0,.35)); }
  .burst.go { animation: pop .8s ease forwards; }
  @keyframes pop { 15% { opacity: 1; transform: scale(1.15); } 30% { transform: scale(.95); } 45%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1) translateY(-20px); } }
  .actions { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; }
  .actions .spacer { flex: 1; }
  .like.on svg { fill: var(--accent); stroke: var(--accent); animation: bump .3s ease; }
  .save.on svg { fill: currentColor; }
  @keyframes bump { 50% { transform: scale(1.25); } }
  .body { padding: 2px 16px 0; }
  .likes { font-weight: 600; margin-bottom: 3px; }
  .caption b, .comment b { font-weight: 600; margin-right: 4px; }
  .comment { margin-top: 2px; }
  .view-all { color: var(--muted); margin-top: 4px; display: inline-block; }
  .add-comment { display: flex; gap: 8px; margin-top: 8px; }
  .add-comment input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; padding: 4px 0; }
  .add-comment input::placeholder { color: var(--muted); }
  .add-comment button { color: var(--accent); font-weight: 600; opacity: .4; }
  .add-comment button.ready { opacity: 1; }

  .loader { display: flex; justify-content: center; padding: 24px; }
  .spinner { width: 26px; height: 26px; border: 2.5px solid var(--line); border-top-color: var(--fg); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Grid (profile / explore) */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .grid .cell { aspect-ratio: 1; background: var(--chip); overflow: hidden; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .profile { padding: 16px; display: flex; gap: 20px; align-items: center; }
  .profile .avatar { width: 80px; height: 80px; }
  .stats { display: flex; flex: 1; justify-content: space-around; text-align: center; }
  .stats b { display: block; font-size: 17px; }
  .bio { padding: 0 16px 14px; }
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }

  /* Bottom nav */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav .wrap { display: flex; justify-content: space-around; height: 56px; align-items: center; }
  nav button.active svg { stroke-width: 2.6; }
  nav .me { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; }
  nav button.active .me { border-color: var(--fg); }

  /* Sheet (upload / comments) */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--card); border-radius: 18px 18px 0 0;
    max-width: 480px; margin: 0 auto; max-height: 88vh; overflow-y: auto; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .sheet.open { transform: none; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
  .sheet h3 { text-align: center; font-size: 16px; margin-bottom: 14px; }
  .preview { width: 100%; aspect-ratio: 4/5; border-radius: 12px; background: var(--chip); display: grid; place-items: center; overflow: hidden; color: var(--muted); text-align: center; }
  .preview img { width: 100%; height: 100%; object-fit: contain; }
  .preview.has-img { aspect-ratio: auto; max-height: 60vh; }
  .preview.has-img img { height: auto; max-height: 60vh; }
  .sheet textarea { width: 100%; margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: transparent; color: var(--fg); font: inherit; font-size: 16px; resize: none; height: 80px; outline: 0; }
  .primary { width: 100%; margin-top: 12px; background: var(--accent); color: #fff; font-weight: 600; padding: 13px; border-radius: 12px; }
  .primary:disabled { opacity: .4; }
  .comment-list .comment { padding: 8px 0; border-bottom: 1px solid var(--line); }

  .month { grid-column: 1 / -1; padding: 14px 16px 8px; font-weight: 600; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; text-align: left; }
  .menu button { display: block; width: 100%; padding: 15px; text-align: center; font-size: 15px; border-bottom: 1px solid var(--line); }
  .menu button.danger { color: #ed4956; font-weight: 600; }
  .menu button:last-child { border-bottom: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 500; opacity: 0; transition: .25s; z-index: 60; pointer-events: none; }
  .toast.success { background: #16a34a; color: #fff; font-weight: 600; padding: 12px 20px; }
  .shared-note { color: #16a34a; font-size: 12px; font-weight: 600; margin-top: 4px; }
  body.viewer .owner-only { display: none !important; }
  .banner { margin: 10px 16px 0; padding: 10px 12px; border-radius: 12px; background: var(--chip); color: var(--muted); font-size: 12.5px; text-align: center; }
  .admin-card { margin: 4px 16px 16px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; }
  .admin-card h4 { font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .admin-card p { color: var(--muted); font-size: 12.5px; }
  .admin-card .primary { margin-top: 10px; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 6px; }
  .av-actions { text-align: center; margin: 4px 0 6px; font-size: 0; }
  .av-actions .pill { display: inline-block; width: 128px; margin: 0 5px; padding: 8px 0; border-radius: 999px; background: var(--chip); color: var(--accent); font-size: 14px; font-weight: 600; text-align: center; }
  .av-actions .pill:only-child { width: 160px; }
  .crop-stage { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 0 auto; overflow: hidden; border-radius: 14px; background: #000; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .crop-stage:active { cursor: grabbing; }
  .crop-stage img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; pointer-events: none; -webkit-user-drag: none; }
  .crop-mask { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle closest-side at center, transparent 82%, rgba(0,0,0,.6) 82.4%); }
  .crop-mask::after { content: ''; position: absolute; left: 9%; top: 9%; width: 82%; height: 82%; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
  .zoom-row { display: flex; align-items: center; gap: 10px; max-width: 340px; margin: 14px auto 0; }
  .zoom-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--fg); }
  .zoom-btn:active { background: var(--chip); }
  .zoom-row svg { width: 22px; height: 22px; }
  .zoom-row input { flex: 1; accent-color: var(--accent); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .day { padding: 18px 16px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .empty .big { font-size: 44px; margin-bottom: 8px; }
  .empty h2 { color: var(--fg); font-size: 18px; margin-bottom: 6px; }
  .empty .primary { width: auto; padding: 12px 22px; margin-top: 16px; }
  .ghost { width: 100%; margin-top: 8px; padding: 9px; border-radius: 10px; background: var(--chip); font-weight: 600; }
  .field { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: transparent; color: var(--fg); font: inherit; font-size: 16px; outline: 0; }
  .avatar-pick { display: block; margin: 0 auto 6px; width: 88px; height: 88px; border-radius: 50%; overflow: hidden; background: var(--chip); }
  .avatar-pick img { width: 100%; height: 100%; object-fit: cover; }
  .center { text-align: center; color: var(--accent); font-weight: 600; display: block; margin: 0 auto 8px; }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="logo">Photography <span>&amp;</span> Friends</div>
    <button class="icon-btn owner-only" id="topUpload" aria-label="New post"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
  </div>
</header>

<main class="wrap" id="app"></main>

<nav>
  <div class="wrap">
    <button data-tab="home" class="active" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <button class="owner-only" id="navUpload" aria-label="New post"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
    <button data-tab="profile" aria-label="Profile"><img class="me" id="navMe" alt=""></button>
  </div>
</nav>

<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="avatarInput" accept="image/*" hidden>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
// Friends' copies carry a snapshot of the feed here. In your own copy this stays null.
const EMBED = /*EMBED_START*/null/*EMBED_END*/;
let VIEWER = !!EMBED;
let ABS_DATES = false;   // true while drawing the friends' copy: fixed dates instead of "2h ago"
// The page as it was before anything was drawn, used to build the friends' copy.
const SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
if (VIEWER) document.body.classList.add('viewer');
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Storage (IndexedDB in this browser) ---------- */
const DB_NAME = 'snapfeed', STORE = 'posts', META = 'meta';
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('no idb'));
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      if (!d.objectStoreNames.contains(META)) d.createObjectStore(META);
      // clear anything left over from the earlier demo version (sample posts)
      if (r.transaction && d.objectStoreNames.contains(STORE)) {
        const st = r.transaction.objectStore(STORE);
        st.openCursor().onsuccess = e => { const c = e.target.result; if (!c) return; if (!c.value.mine) c.delete(); c.continue(); };
      }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
function tx(store, mode, fn) {
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode), q = fn(t.objectStore(store));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  }));
}
const dbAll = () => tx(STORE, 'readonly', s => s.getAll()).catch(() => []);
const dbPut = p => tx(STORE, 'readwrite', s => s.put(p)).catch(() => toast('Couldn’t save — storage unavailable'));
const dbDel = id => tx(STORE, 'readwrite', s => s.delete(id)).catch(() => {});
const metaGet = k => tx(META, 'readonly', s => s.get(k)).catch(() => null);
const metaPut = (k, v) => tx(META, 'readwrite', s => s.put(v, k)).catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- Profile ---------- */
let profile = { name: 'me', bio: '', avatar: '' };
function initialsAvatar(name) {
  const ch = (name.trim()[0] || '?').toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#ff3b5c"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="46" font-weight="600" fill="#fff">${esc(ch)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const avatar = () => profile.avatar || initialsAvatar(profile.name);

/* ---------- Time helpers ---------- */
function ago(t) {
  if (ABS_DATES) return dayLabel(t);
  const s = Math.max(1, (Date.now() - t) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 7 * 86400) return Math.floor(s / 86400) + 'd ago';
  return dayLabel(t);
}
function dayLabel(t) {
  const d = new Date(t), now = new Date();
  if (ABS_DATES) return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  const start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((start(now) - start(d)) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: diff < 7 ? 'long' : undefined, month: 'long', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
const fullDate = t => new Date(t).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const monthLabel = t => new Date(t).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

/* ---------- State ---------- */
let posts = [];   // newest first
let tab = 'home';
const sortPosts = () => posts.sort((a, b) => b.createdAt - a.createdAt);
const find = id => posts.find(p => p.id === id);
const el = id => document.querySelector(`.post[data-id="${id}"]`);

/* ---------- Rendering ---------- */
const CAM = '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const PIN = '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
function subline(p) {
  const bits = [];
  if (p.place) bits.push(PIN + esc(p.place));
  if (p.camera) bits.push(CAM + esc(p.camera));
  return bits.length ? `<small>${bits.join(' &nbsp;·&nbsp; ')}</small>` : '';
}
function postHTML(p) {
  const shown = p.comments.slice(-2), first = p.photos[0], n = p.photos.length;
  return `<article class="post" data-id="${p.id}">
    <div class="post-head">
      <img class="avatar" src="${avatar()}" alt="">
      <div class="who"><b>${esc(profile.name)}</b>${subline(p)}</div>
      <button class="icon-btn" aria-label="More" onclick="openMenu('${p.id}')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
    <div class="media" data-dbl="${p.id}"${first.w && first.h ? ` style="aspect-ratio:${mediaRatio(first.w, first.h)}"` : ''}>

const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(html) { sheet.innerHTML = '<div class="grab"></div>' + html; sheet.classList.add('open'); scrim.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet() { sheet.classList.remove('open'); scrim.classList.remove('open'); document.body.style.overflow = ''; }

// Shrink big phone photos so many fit in storage
// Photo frame matches the photo: landscape shows in full; very tall photos are capped at 4:5
function mediaRatio(w, h) { return Math.max(w / h, 0.8).toFixed(4); }
// The frame takes the shape of the first photo in the post
function fitMedia(img, i) {
  if (!i) img.closest('.media').style.aspectRatio = mediaRatio(img.naturalWidth, img.naturalHeight);
  img.classList.add('loaded');
}
const slideIdx = new Map();   // which photo each post is showing
function onSlide(track, id) {
  const i = Math.round(track.scrollLeft / track.clientWidth);
  if (slideIdx.get(id) === i) return;
  slideIdx.set(id, i);
  const post = track.closest('.post'), n = track.children.length;
  const c = post.querySelector('.count'); if (c) c.textContent = `${i + 1}/${n}`;
  post.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', j === i));
}
let lastSize = { w: 0, h: 0 };
// One shared canvas, emptied after every photo. (Safari on iPhone has a hard cap on
// total canvas memory; creating a new canvas per photo made later photos fail.)
const workCanvas = document.createElement('canvas');
function resizeImage(file, max = 1440, quality = 0.86) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    const cleanup = () => { URL.revokeObjectURL(url); img.onload = img.onerror = null; img.src = ''; };
    img.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = workCanvas, w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        if (!ctx) throw new Error('no canvas');
        ctx.drawImage(img, 0, 0, w, h);
        const data = c.toDataURL('image/jpeg', quality);
        c.width = c.height = 1;                                  // release canvas memory right away
        cleanup();
        if (!data || data.length < 100) return rej(new Error('empty'));
        lastSize = { w, h };
        res(data);
      } catch (err) { workCanvas.width = workCanvas.height = 1; cleanup(); rej(err); }
    };
    img.onerror = () => { cleanup(); rej(new Error('decode')); };
    img.src = url;
  });
}

const MAX_PHOTOS = 10;

/* ---------- Drag to reorder (hold, then drag) ---------- */
// Touch: hold ~0.3s without moving, then drag. Mouse: just drag.
let drag = null;
function dragStart(thumb, x, y, isTouch) {
  if (busy) return;
  drag = { thumb, strip: thumb.parentElement, sx: x, sy: y, x, active: false, timer: null, raf: null };
  if (isTouch) drag.timer = setTimeout(() => activateDrag(), 300);
}
function activateDrag() {
  if (!drag) return;
  drag.active = true;
  drag.thumb.classList.add('dragging');
  drag.strip.classList.add('sorting');
  drag.grab = drag.sx - drag.thumb.getBoundingClientRect().left;
  drag.dx = 0;
  if (navigator.vibrate) navigator.vibrate(15);
  autoScroll();
}
function dragMove(x, y, e) {
  if (!drag) return;
  if (!drag.active) {
    const moved = Math.hypot(x - drag.sx, y - drag.sy);
    if (drag.timer) { if (moved > 8) { clearTimeout(drag.timer); drag = null; } return; } // it's a scroll
    if (moved > 5) activateDrag(); else return;                                           // mouse drag
  }
  if (e && e.cancelable) e.preventDefault();
  drag.x = x;
  positionDrag();
}
function positionDrag() {
  const { thumb, strip } = drag;
  const w = thumb.offsetWidth;
  const left = drag.x - drag.grab;            // where the photo should sit (under the finger)
  const center = left + w / 2;
  // swap with a neighbour once the dragged photo's centre passes the neighbour's centre
  let moved = true;
  while (moved) {
    moved = false;
    const items = [...strip.querySelectorAll('.thumb')], idx = items.indexOf(thumb);
    const next = items[idx + 1], prev = items[idx - 1];
    if (next) { const r = next.getBoundingClientRect(); if (center > r.left + r.width / 2) { strip.insertBefore(next, thumb); moved = true; continue; } }
    if (prev) { const r = prev.getBoundingClientRect(); if (center < r.left + r.width / 2) { strip.insertBefore(thumb, prev); moved = true; } }
  }
  const natural = thumb.getBoundingClientRect().left - (drag.dx || 0);
  drag.dx = left - natural;
  thumb.style.transform = `translateX(${drag.dx}px) scale(1.06)`;
  renumber();
}
function renumber() {
  drag.strip.querySelectorAll('.thumb').forEach((t, i) => { const n = t.querySelector('.n'); if (n) n.textContent = i + 1; });
}
function autoScroll() {
  if (!drag || !drag.active) return;
  const r = drag.strip.getBoundingClientRect(), edge = 40;
  let v = 0;
  if (drag.x < r.left + edge) v = -8; else if (drag.x > r.right - edge) v = 8;
  if (v) { drag.strip.scrollLeft += v; positionDrag(); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function dragEnd() {
  if (!drag) return;
  clearTimeout(drag.timer); cancelAnimationFrame(drag.raf);
  if (drag.active) {
    const order = [...drag.strip.querySelectorAll('.thumb')].map(t => +t.dataset.i);
    const keep = drag.strip.scrollLeft;
    pending = order.map(i => pending[i]);
    drag = null;
    renderPicker();
    const st = document.querySelector('#pickArea .strip'); if (st) st.scrollLeft = keep;
  } else drag = null;
}
document.addEventListener('touchstart', e => {
  const t = e.target.closest('.thumb'); if (!t || e.target.closest('button')) return;
  dragStart(t, e.touches[0].clientX, e.touches[0].clientY, true);
}, { passive: true });
document.addEventListener('touchmove', e => { if (drag) dragMove(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive: false });
document.addEventListener('touchend', dragEnd);
document.addEventListener('touchcancel', dragEnd);
document.addEventListener('mousedown', e => {
  const t = e.target.closest('.thumb'); if (!t || e.target.closest('button') || e.button) return;
  e.preventDefault(); dragStart(t, e.clientX, e.clientY, false);
});
document.addEventListener('mousemove', e => { if (drag) dragMove(e.clientX, e.clientY, e); });
document.addEventListener('mouseup', dragEnd);
document.addEventListener('contextmenu', e => { if (e.target.closest('.thumb')) e.preventDefault(); });
document.getElementById('fileInput').onchange = async e => {
  const input = e.target;
  const files = [...input.files].slice(0, MAX_PHOTOS - pending.length);
  if (!files.length || busy) { input.value = ''; return; }
  busy = true; renderPicker();
  // Copy every picked photo into memory first. On iPhone, the picker's temporary files can
  // disappear once the input is reset, which used to drop every photo after the first.
  const copies = await Promise.all(files.map(f =>
    f.arrayBuffer().then(b => new Blob([b], { type: f.type || 'image/jpeg' })).catch(() => null)));
  input.value = '';
  let failed = 0;
  for (const blob of copies) {
    if (!blob) { failed++; continue; }
    try {
      let img;
      try { img = await resizeImage(blob); }
      catch { img = await resizeImage(blob, 1080, 0.85); }       // retry smaller if memory is tight
      pending.push({ img, w: lastSize.w, h: lastSize.h });
      renderPicker();
    } catch { failed++; }
  }
  busy = false; renderPicker();
  if (failed) toast(`Couldn’t read ${failed} photo${failed > 1 ? 's' : ''}`);
};

function fileName(p, i = 0) { return `photography-and-friends-${new Date(p.createdAt).toISOString().slice(0, 10)}${p.photos.length > 1 ? '-' + (i + 1) : ''}.jpg`; }
function downloadPost(id) {
  const p = find(id), i = slideIdx.get(id) || 0, a = document.createElement('a');
  a.href = p.photos[i].img; a.download = fileName(p, i);
  document.body.appendChild(a); a.click(); a.remove(); closeSheet();

// Turn the stored photo into a File synchronously. Safari only allows the share
// sheet if navigator.share() runs right inside the tap — no awaiting before it.
const fileCache = new Map();
function photoFile(p, i = 0) {
  const key = p.id + ':' + i;
  if (fileCache.has(key)) return fileCache.get(key);
  const [head, data] = p.photos[i].img.split(',');
  const type = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(data), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const file = new File([bytes], fileName(p, i), { type, lastModified: p.createdAt });
  fileCache.set(key, file);
  return file;
}
// Share the actual photo through the phone's share sheet (Messages, WhatsApp, etc.)
function sharePost(id) {
  const p = find(id);
  let files;
  try { files = p.photos.map((_, i) => photoFile(p, i)); } catch { return shareFallback(id); }
  if (navigator.share && navigator.canShare && navigator.canShare({ files })) {
    navigator.share({ files })
      .then(() => markShared(id))
      .catch(e => {
        if (e && e.name === 'AbortError') return toast('Share cancelled');   // user closed the share sheet
        shareFallback(id);
      });
  } else {
    shareFallback(id);
  }
}
// Fallback: show the photo so it can be long-pressed (iPhone: Save to Photos / Share),
// plus a retry button and a direct download link.
function shareFallback(id) {
  const p = find(id);
  const many = p.photos.length > 1;
  openSheet(`<h3>Share ${many ? p.photos.length + ' photos' : 'photo'}</h3>
    <p style="text-align:center;color:var(--muted);margin-bottom:10px">Press and hold ${many ? 'a' : 'the'} photo to save or share it.</p>
    <div class="fallback-photos">${p.photos.map(ph => `<img src="${ph.img}" alt="">`).join('')}</div>
    ${navigator.share ? `<button class="primary" onclick="sharePost('${id}')">Try share again</button>` : ''}
    <a class="ghost" style="display:block;text-align:center;color:inherit;text-decoration:none" href="${p.photos[slideIdx.get(id) || 0].img}" download="${fileName(p, slideIdx.get(id) || 0)}" onclick="setTimeout(()=>{closeSheet();toast('✓ Photo downloaded')},300)">${many ? 'Download current photo' : 'Download photo'}</a>`);
}
// Confirmation after a successful share: big check toast + a "Shared" note saved on the post
function markShared(id) {
  const p = find(id); if (!p) return;
  p.shares = (p.shares || 0) + 1; p.lastSharedAt = Date.now();
  dbPut(p); refreshPost(id); closeSheet();
  toast('✓ Post shared', true);
}
function sharedNote(p) {
  if (!p.shares) return '';
  return `<div class="shared-note">✓ Shared${p.shares > 1 ? ' ' + p.shares + ' times' : ''} · ${ago(p.lastSharedAt)}</div>`;
}
function jumpTo(id) {
  setTab('home');
  requestAnimationFrame(() => el(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
}

/* ---------- Profile editing ---------- */
// draft = what's in the editor until you tap Save
let draft = null;
function openProfileEdit() {
  draft = { name: profile.name, bio: profile.bio, avatar: profile.avatar,
            avatarSrc: profile.avatarSrc || profile.avatar || '', crop: profile.crop || null };
  showProfileForm();
}
function showProfileForm() {
  const pic = draft.avatar || initialsAvatar(draft.name);
  openSheet(`<h3>Edit profile</h3>
    <button class="avatar-pick" onclick="${draft.avatarSrc ? 'openCropper()' : 'chooseAvatar()'}" aria-label="Adjust profile photo"><img id="avPrev" src="${pic}" alt=""></button>
    <div class="av-actions">
      <button class="pill" onclick="chooseAvatar()">${draft.avatarSrc ? 'Change photo' : 'Add photo'}</button>${draft.avatarSrc ? `<button class="pill" onclick="openCropper()">Adjust</button>` : ''}
    </div>
    <input class="field" id="pname" maxlength="30" placeholder="Name" value="${esc(draft.name)}">
    <textarea id="pbio" placeholder="Bio" maxlength="150">${esc(draft.bio)}</textarea>
    <button class="primary" onclick="saveProfile()">Save</button>`);
}
function keepFormValues() {
  const n = document.getElementById('pname'), b = document.getElementById('pbio');
  if (n) draft.name = n.value; if (b) draft.bio = b.value;
}
function chooseAvatar() { keepFormValues(); document.getElementById('avatarInput').click(); }
document.getElementById('avatarInput').onchange = async e => {
  const input = e.target, f = input.files[0]; if (!f) return;
  try {
    const blob = new Blob([await f.arrayBuffer()], { type: f.type || 'image/jpeg' });
    input.value = '';
    draft.avatarSrc = await resizeImage(blob, 1440, 0.88);   // keep the full photo so it can be re-adjusted later
    draft.crop = null;
    openCropper();
  } catch { input.value = ''; toast('Couldn’t read that photo'); }
};

/* ---------- Profile photo cropper: drag to move, pinch / slider to zoom ---------- */
const AV_OUT = 400;     // saved avatar size (px)
let cr = null;          // cropper state
function openCropper() {
  keepFormValues();
  openSheet(`<h3>Adjust profile photo</h3>
    <div class="crop-stage" id="cropStage"><img id="cropImg" alt="" draggable="false"><div class="crop-mask"></div></div>
    <div class="zoom-row">
      <button class="zoom-btn" aria-label="Zoom out" onclick="zoomStep(-1)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8.5 11h5M20 20l-4.5-4.5"/></svg></button>
      <input type="range" id="cropZoom" min="1" max="5" step="0.01" value="1" aria-label="Zoom">
      <button class="zoom-btn" aria-label="Zoom in" onclick="zoomStep(1)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8.5 11h5M11 8.5v5M20 20l-4.5-4.5"/></svg></button>
    </div>
    <p class="hint" style="text-align:center">Drag the photo to move it inside the circle · pinch or slide to zoom</p>
    <button class="primary" onclick="applyCrop()">Done</button>
    <button class="ghost" onclick="showProfileForm()">Cancel</button>`);
  const img = document.getElementById('cropImg');
  img.onload = () => initCropper(img);
  img.src = draft.avatarSrc;
}
function initCropper(img) {
  const stage = document.getElementById('cropStage');
  const S = stage.clientWidth, D = Math.round(S * 0.82);           // stage size, circle diameter
  const w = img.naturalWidth, h = img.naturalHeight;
  const base = D / Math.min(w, h);                                  // smallest zoom that still fills the circle
  cr = { stage, img, S, D, w, h, base, zoom: 1, x: 0, y: 0, pointers: new Map() };
  // restore a previous crop, else centre the photo
  if (draft.crop && draft.crop.size) {
    cr.zoom = Math.min(5, Math.max(1, D / (draft.crop.size * w) / base));
    const sc = base * cr.zoom;
    cr.x = S / 2 - (draft.crop.cx * w) * sc;
    cr.y = S / 2 - (draft.crop.cy * h) * sc;
  } else {
    const sc = base; cr.x = (S - w * sc) / 2; cr.y = (S - h * sc) / 2;
  }
  img.style.width = w + 'px'; img.style.height = h + 'px';
  clampCrop(); drawCrop();
  const zoomEl = document.getElementById('cropZoom');
  zoomEl.value = cr.zoom;
  zoomEl.oninput = () => zoomAt(+zoomEl.value, S / 2, S / 2);
  // ----- Touch: one finger drags, two fingers pinch-zoom (and drag) -----
  let last = null;   // previous touch snapshot
  const snap = t => t.length >= 2
    ? { n: 2, x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2, d: Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) }
    : t.length === 1 ? { n: 1, x: t[0].clientX, y: t[0].clientY } : null;
  const onTouch = e => {
    if (!cr) return;
    e.preventDefault();                       // stop the page from scrolling or zooming
    const now = snap(e.touches);
    if (e.type === 'touchmove' && last && now && last.n === now.n) {
      cr.x += now.x - last.x; cr.y += now.y - last.y;           // move with the finger(s)
      if (now.n === 2 && last.d > 0) {
        const r = stage.getBoundingClientRect();
        zoomAt(cr.zoom * now.d / last.d, now.x - r.left, now.y - r.top);
      } else { clampCrop(); drawCrop(); }
    }
    last = now;
  };
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(t => stage.addEventListener(t, onTouch, { passive: false }));
  // Safari's own pinch gesture events: block page zoom while pinching the photo
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => stage.addEventListener(t, e => e.preventDefault(), { passive: false }));
  // ----- Mouse / pen -----
  stage.onpointerdown = e => { if (e.pointerType === 'touch') return; stage.setPointerCapture(e.pointerId); cr.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); };
  stage.onpointermove = e => {
    if (e.pointerType === 'touch' || !cr.pointers.has(e.pointerId)) return;
    const prev = cr.pointers.get(e.pointerId), now = { x: e.clientX, y: e.clientY };
    if (cr.pointers.size === 1) {                                     // drag
      cr.x += now.x - prev.x; cr.y += now.y - prev.y;
      cr.pointers.set(e.pointerId, now); clampCrop(); drawCrop();
    } else if (cr.pointers.size === 2) {                              // pinch
      const [a, b] = [...cr.pointers.values()];
      const other = a === prev ? b : a;
      const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(now.x - other.x, now.y - other.y);
      cr.pointers.set(e.pointerId, now);
      const r = stage.getBoundingClientRect();
      if (d0 > 0) zoomAt(cr.zoom * d1 / d0, (now.x + other.x) / 2 - r.left, (now.y + other.y) / 2 - r.top);
    }
  };
  const end = e => cr && cr.pointers.delete(e.pointerId);
  stage.onpointerup = stage.onpointercancel = end;
  stage.onwheel = e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(cr.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e.clientX - r.left, e.clientY - r.top); };
}
// +/- buttons: zoom around the centre of the circle, with a short smooth animation
function zoomStep(dir) {
  if (!cr) return;
  const from = cr.zoom, to = Math.min(5, Math.max(1, from * (dir > 0 ? 1.25 : 0.8)));
  if (to === from) return;
  const t0 = performance.now(), dur = 160;
  const tick = now => {
    if (!cr) return;
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    zoomAt(from + (to - from) * e, cr.S / 2, cr.S / 2);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function zoomAt(z, px, py) {
  z = Math.min(5, Math.max(1, z));
  const s0 = cr.base * cr.zoom, s1 = cr.base * z;
  cr.x = px - (px - cr.x) * s1 / s0; cr.y = py - (py - cr.y) * s1 / s0;   // keep the point under fingers fixed
  cr.zoom = z; clampCrop(); drawCrop();
  const zoomEl = document.getElementById('cropZoom'); if (zoomEl && +zoomEl.value !== z) zoomEl.value = z;
}
function clampCrop() {
  // the photo must always cover the whole circle
  const sc = cr.base * cr.zoom, c0 = (cr.S - cr.D) / 2, c1 = c0 + cr.D;
  cr.x = Math.min(c0, Math.max(c1 - cr.w * sc, cr.x));
  cr.y = Math.min(c0, Math.max(c1 - cr.h * sc, cr.y));
}
function drawCrop() {
  cr.img.style.transform = `translate(${cr.x}px, ${cr.y}px) scale(${cr.base * cr.zoom})`;
}
function applyCrop() {
  if (!cr) return;
  const sc = cr.base * cr.zoom, c0 = (cr.S - cr.D) / 2;
  const sx = (c0 - cr.x) / sc, sy = (c0 - cr.y) / sc, size = cr.D / sc;      // crop square in photo pixels
  const c = workCanvas; c.width = c.height = AV_OUT;
  c.getContext('2d').drawImage(cr.img, sx, sy, size, size, 0, 0, AV_OUT, AV_OUT);
  draft.avatar = c.toDataURL('image/jpeg', 0.88);
  c.width = c.height = 1;
  // remember the crop (as fractions of the photo) so "Adjust" reopens where you left it
  draft.crop = { cx: (sx + size / 2) / cr.w, cy: (sy + size / 2) / cr.h, size: size / cr.w };
  cr = null;
  showProfileForm();
}
async function saveProfile() {
  keepFormValues();
  profile.name = draft.name.trim() || 'me';
  profile.bio = draft.bio.trim();
  profile.avatar = draft.avatar || '';
  profile.avatarSrc = draft.avatarSrc || '';
  profile.crop = draft.crop;
  await metaPut('profile', profile);
  draft = null;
  closeSheet(); render(); toast('Profile saved');
}

/* ---------- Nav ---------- */
function setTab(t) { tab = t; document.querySelectorAll('nav [data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); render(); }
document.querySelectorAll('nav [data-tab]').forEach(b => b.onclick = () => tab === b.dataset.tab ? window.scrollTo({ top: 0, behavior: 'smooth' }) : setTab(b.dataset.tab));
document.getElementById('navUpload').onclick = openUpload;
document.getElementById('topUpload').onclick = openUpload;

let toastTimer;
function toast(msg, success) {
  const t = document.getElementById('toast'); t.textContent = msg;
  t.classList.toggle('success', !!success); t.classList.add('show');
  if (success && navigator.vibrate) navigator.vibrate(30);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), success ? 2400 : 1800);
}

// Keep "5m ago" labels fresh
setInterval(() => document.querySelectorAll('.post').forEach(n => { const p = find(n.dataset.id); const t = n.querySelector('time'); if (p && t) t.textContent = ago(p.createdAt); }), 60000);

/* ---------- Share feed with friends (view-only copy) ---------- */
function buildFriendCopy() {
  const snapshot = {
    exportedAt: Date.now(),
    profile: { name: profile.name, bio: profile.bio, avatar: profile.avatar },
    // photos themselves live in the pre-drawn feed below (stored once, not twice)
    posts: posts.map(p => ({ id: p.id, photos: p.photos.map(ph => ({ w: ph.w, h: ph.h })), caption: p.caption, place: p.place, camera: p.camera, createdAt: p.createdAt, comments: [] }))
  };
  // escape "<" so captions can never break out of the <script>
  const json = JSON.stringify(snapshot).replace(/</g, '\\u003c').replace(/\u2028|\u2029/g, '');
  // Pre-draw the feed into the file, so it shows even where scripts don't run
  // (e.g. the iPhone preview when the file is opened from Messages, Mail or WhatsApp)
  let staticFeed;
  VIEWER = true; ABS_DATES = true;
  try {
    staticFeed = `<div class="banner">${esc(profile.name)}’s feed · updated ${dayLabel(snapshot.exportedAt)}</div><div id="feed">${feedHTML()}</div>`;
  } finally { VIEWER = false; ABS_DATES = false; }
  const html = SOURCE
    .replace('/*EMBED_START*/null/*EMBED_END*/', () => '/*EMBED_START*/' + json + '/*EMBED_END*/')
    .replace('<body>', '<body class="viewer">')
    .replace('<main class="wrap" id="app"></main>', () => '<main class="wrap" id="app">' + staticFeed + '</main>')
    .replace('</head>', '<noscript><style>nav,.post-head .icon-btn,.actions .icon-btn{display:none}.actions{min-height:22px}body{padding-bottom:24px}</style></noscript></head>');
  return new File([html], 'Photography-and-Friends.html', { type: 'text/html' });
}
const sizeLabel = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function exportForFriends() {
  if (VIEWER || !posts.length) return;
  let file;
  try { file = buildFriendCopy(); } catch { return toast('Couldn’t build the file'); }
  // Open the phone's share sheet right away (Safari needs this inside the tap)
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Photography & Friends' })
      .then(() => toast('✓ Feed shared', true))
      .catch(e => { if (e && e.name === 'AbortError') return toast('Share cancelled'); exportFallback(file); });
  } else exportFallback(file);
}
function exportFallback(file) {
  const url = URL.createObjectURL(file);
  openSheet(`<h3>Share feed with friends</h3>
    <p style="color:var(--muted);text-align:center">Download the view-only copy (${sizeLabel(file.size)}), then send it to friends by email, Messages, AirDrop or a shared drive. They open it in any browser.</p>
    <a class="primary" style="display:block;text-align:center;text-decoration:none" href="${url}" download="${file.name}" onclick="setTimeout(()=>{closeSheet();toast('✓ Feed file downloaded',true)},300)">Download ${file.name}</a>
    <button class="ghost" onclick="closeSheet()">Close</button>`);
}

/* ---------- Boot ---------- */
(async () => {
  if (VIEWER) {
    profile = { ...profile, ...EMBED.profile };
    // pick the photos up from the pre-drawn feed
    const pre = new Map();
    document.querySelectorAll('#app .post').forEach(n => pre.set(n.dataset.id, [...n.querySelectorAll('.slide img')].map(i => i.getAttribute('src'))));
    posts = EMBED.posts.map(p => ({ caption: '', place: '', camera: '', comments: [], ...p,
      photos: p.photos.map((ph, i) => ({ ...ph, img: ph.img || (pre.get(p.id) || [])[i] || '' })) }));
    sortPosts(); render(); return;
  }
  const saved = await metaGet('profile');
  if (saved) profile = { ...profile, ...saved };
  posts = (await dbAll()).filter(p => p.mine).map(p => {
    const q = { caption: '', place: '', camera: '', comments: [], ...p };
    if (/noritsu|ez controller|frontier|fujifilm sp-?3000/i.test(q.camera)) { q.camera = ''; dbPut(q); }
    if (!Array.isArray(q.photos) || !q.photos.length) {
      q.photos = q.img ? [{ img: q.img, w: q.w, h: q.h }] : [];
      delete q.img; delete q.w; delete q.h;
    }
    return q;
  }).filter(p => p.photos.length);
  sortPosts();
  render();
})();
</script>
